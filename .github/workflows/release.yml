name: Release
# Push a tag like v1.0.0 to build + publish. "Run workflow" builds artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Windows
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}      # optional: base64 of your code-signing .pfx
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pillow pyside6
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Bundle 7-Zip (preinstalled on the runner)
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\7-Zip\7z.exe" packaging\7zip\
          Copy-Item "C:\Program Files\7-Zip\7z.dll" packaging\7zip\
      - name: Build exe
        run: >
          python -m PyInstaller --noconsole --onedir --clean --noupx --name SubGrab
          --icon assets\subgrab.ico --version-file packaging\version_info.txt --hidden-import PIL._tkinter_finder
          --hidden-import keyring.backends.Windows
          --add-binary "packaging\7zip\7z.exe;7zip" --add-binary "packaging\7zip\7z.dll;7zip"
          --add-data "qml;qml" --add-data "assets\Inter-Variable.ttf;assets"
          --collect-all PySide6.QtQml --collect-all PySide6.QtQuick
          --collect-all PySide6.QtQuick.Controls --collect-all PySide6.QtQuick.Templates
          --collect-all PySide6.QtQuick.Layouts --collect-all PySide6.QtQuick.Window
          subgrab.py
      - name: Prune unused Qt modules
        run: python scripts/prune_bundle.py dist/SubGrab
      - name: Prepare signing tool (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($st.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: '& $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\SubGrab\SubGrab.exe'
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\SubGrab.iss
      - name: Sign installer (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: '& $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer\SubGrab-Setup.exe'
      - name: Portable zip + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item dist\SubGrab portable\SubGrab -Recurse
          New-Item portable\portable.txt -ItemType File | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md portable\
          Compress-Archive -Path portable\* -DestinationPath SubGrab-portable.zip
          Copy-Item installer\SubGrab-Setup.exe .
          Get-FileHash SubGrab-Setup.exe, SubGrab-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SubGrab-windows
          path: |
            SubGrab-Setup.exe
            SubGrab-portable.zip
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SubGrab-Setup.exe
            SubGrab.exe
            SubGrab-portable.zip
            SHA256SUMS.txt

  build-macos:
    runs-on: macos-latest
    name: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pillow pyside6
      - name: Tests
        run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build app
        run: >
          python -m PyInstaller --windowed --onedir --clean --noupx --name SubGrab
          --icon assets/subgrab.icns --hidden-import keyring.backends.macOS
          --add-data "qml:qml" --add-data "assets/Inter-Variable.ttf:assets"
          --collect-all PySide6.QtQml --collect-all PySide6.QtQuick
          --collect-all PySide6.QtQuick.Controls --collect-all PySide6.QtQuick.Templates
          --collect-all PySide6.QtQuick.Layouts --collect-all PySide6.QtQuick.Window
          subgrab.py
      - name: Prune unused Qt modules
        run: python scripts/prune_bundle.py dist
      - name: Zip app + checksum
        run: |
          cd dist
          zip -q -r ../SubGrab-macOS.zip SubGrab.app
          cd ..
          shasum -a 256 SubGrab-macOS.zip | tee SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SubGrab-macos
          path: |
            SubGrab-macOS.zip
            SHA256SUMS-macOS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SubGrab-macOS.zip
            SHA256SUMS-macOS.txt

  build-linux:
    runs-on: ubuntu-24.04
    name: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyinstaller pillow pyside6
      - name: Tests
        run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install Qt runtime deps
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Build binary
        run: >
          python -m PyInstaller --windowed --onedir --clean --noupx --name SubGrab
          --hidden-import keyring.backends.SecretService
          --add-data "qml:qml" --add-data "assets/Inter-Variable.ttf:assets"
          --collect-all PySide6.QtQml --collect-all PySide6.QtQuick
          --collect-all PySide6.QtQuick.Controls --collect-all PySide6.QtQuick.Templates
          --collect-all PySide6.QtQuick.Layouts --collect-all PySide6.QtQuick.Window
          subgrab.py
      - name: Prune unused Qt modules
        run: python scripts/prune_bundle.py dist/SubGrab
      - name: Tar binary + checksum
        run: |
          tar -C dist -czf SubGrab-linux.tar.gz SubGrab
          sha256sum SubGrab-linux.tar.gz | tee SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SubGrab-linux
          path: |
            SubGrab-linux.tar.gz
            SHA256SUMS-linux.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SubGrab-linux.tar.gz
            SHA256SUMS-linux.txt
