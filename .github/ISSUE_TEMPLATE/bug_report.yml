name: Bug report
description: Something does not work
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SubGrab version (Settings > About)
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Which source?
      options: [OpenSubtitles, SubSource, Podnapisi, Subf2m, YIFY, Subscene, "All / not source related"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "Settings > Advanced > Open debug log. Remove API keys / passwords before pasting."
      render: text
